name: JS Test Doctor
description: Diagnose common Jest and Vitest setup problems in CI.
inputs:
  root:
    description: Project directory to scan, relative to the checked-out repository.
    required: false
    default: "."
  log:
    description: Optional path to a saved test log.
    required: false
    default: ""
  strict:
    description: Fail the job for high-confidence errors.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run JS Test Doctor
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_LOG: ${{ inputs.log }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: node "$GITHUB_ACTION_PATH/action/run.js"
